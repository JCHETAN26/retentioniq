services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retentioniq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retentioniq}
      POSTGRES_DB: ${POSTGRES_DB:-retentioniq}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  mlflow:
    build: ./infrastructure/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["5000:5000"]
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-retentioniq}:${POSTGRES_PASSWORD:-retentioniq}@postgres:5432/mlflow
      --artifacts-destination /mlartifacts
      --serve-artifacts
    volumes:
      - mlartifacts:/mlartifacts

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["serving"]
    ports: ["8000:8000"]
    environment:
      RIQ_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-retentioniq}:${POSTGRES_PASSWORD:-retentioniq}@postgres:5432/${POSTGRES_DB:-retentioniq}
    depends_on: [postgres]

  airflow:
    build: ./pipelines/airflow
    profiles: ["orchestration"]
    command: standalone
    ports: ["8080:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/retentioniq/pipelines/airflow/dags
      RIQ_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-retentioniq}:${POSTGRES_PASSWORD:-retentioniq}@postgres:5432/${POSTGRES_DB:-retentioniq}
      RIQ_MLFLOW_TRACKING_URI: http://mlflow:5000
      POSTGRES_HOST: postgres
    volumes:
      - .:/opt/retentioniq
    depends_on: [postgres, mlflow]

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    ports: ["3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  pgdata:
  mlartifacts:
