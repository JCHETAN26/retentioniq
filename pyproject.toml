[project]
name = "retentioniq"
version = "0.1.0"
description = "Customer intelligence, retention and treatment-optimization platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=2.0",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pandera>=0.24",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
# Installed incrementally as phases need them: `uv sync --extra ml`, etc.
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "mlflow>=2.14",
    "shap>=0.45",
]
survival = ["lifelines>=0.29"]
uplift = []  # learners and metrics are implemented in-house (retentioniq.models.uplift)
deep = ["torch>=2.3"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "prometheus-client>=0.20"]
monitoring = ["evidently>=0.4"]
dbt = ["dbt-core>=1.8", "dbt-postgres>=1.8"]

[project.scripts]
retentioniq = "retentioniq.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retentioniq"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PTH", "RUF", "PD", "NPY"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["retentioniq"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "xgboost.*", "lifelines.*", "shap.*", "mlflow.*", "sklearn.*", "joblib.*",
          "torch.*", "scipy.*", "evidently.*"]
ignore_missing_imports = true
follow_untyped_imports = false

# Modelling code wraps untyped ML libraries; keep strictness but allow Any to flow through them.
[[tool.mypy.overrides]]
module = ["retentioniq.models.*", "retentioniq.training.*", "retentioniq.analytics.*"]
warn_return_any = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires docker services (postgres, mlflow)",
    "data: requires raw datasets in data/raw",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
